name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile || bun install
      - run: bun run check
      - run: bun test
      - run: node --check extension/chatgpt/content.js
      - run: node --check extension/chatgpt/deepseek.js
      - run: node --check extension/chatgpt/background.js
